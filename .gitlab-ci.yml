# Lint, test, validate and release the Teamspeak 3 Server integration.
#
# Tags:
#   - Git tag X.Y.Z -> checks that the tag matches the manifest version,
#     creates a GitLab Release, attaches the integration archive and mirrors
#     the release to GitHub for HACS.
#   - Merge requests and pushes to the default branch run lint, test and hassfest.
#   - Only the default branch and version tags are force-pushed to the configured
#     GitHub fork. Requires GITHUB_REPOSITORY and a protected GITHUB_TOKEN.

stages:
  - lint
  - test
  - validate
  - release

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHON_IMAGE: "python:3.14-bookworm"
  # Ziel des HACS-Mirrors. Ohne diesen Wert bricht mirror-github mit
  # "GITHUB_REPOSITORY is required" ab. GITHUB_TOKEN bleibt eine geschuetzte
  # CI-Variable und steht nicht im Repo.
  GITHUB_REPOSITORY: "P4nto/homeassistant-teamspeak"

default:
  interruptible: true
  cache:
    key:
      files:
        - requirements-dev.txt
    paths:
      - .cache/pip

lint:
  stage: lint
  image: "$PYTHON_IMAGE"
  script:
    - python -m pip install --upgrade pip
    - python -m pip install "ruff==0.17.2"
    - ruff check .
    - ruff format --check .

test:
  stage: test
  image: "$PYTHON_IMAGE"
  script:
    - python -m pip install --upgrade pip
    - python -m pip install --requirement requirements-dev.txt
    - python -m pytest -q
      --cov=custom_components.teamspeak
      --cov-report=term-missing
      --cov-report=xml
      --junitxml=report.xml
  coverage: '/^TOTAL.*?(\d+%)$/'
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - report.xml

hassfest:
  stage: validate
  image:
    name: "ghcr.io/home-assistant/hassfest:2026.11.0"
    entrypoint: [""]
  script:
    - /usr/src/homeassistant/script/hassfest/docker/entrypoint.sh

check-version:
  stage: validate
  image: alpine:3.21
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  before_script:
    - apk add --no-cache jq
  script:
    - VERSION="${CI_COMMIT_TAG}"
    - MANIFEST_VERSION="$(jq -r .version custom_components/teamspeak/manifest.json)"
    - |
      if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
        echo "ERROR: tag ${CI_COMMIT_TAG} does not match manifest.json version ${MANIFEST_VERSION}"
        echo "Tag the commit that contains the matching version bump."
        exit 1
      fi
    - echo "Tag ${CI_COMMIT_TAG} matches manifest.json version ${VERSION}."

release-preflight:
  stage: validate
  image: alpine:3.21
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  before_script:
    - apk add --no-cache jq
  script:
    - test "$CI_COMMIT_TAG" = "$(jq -r .version custom_components/teamspeak/manifest.json)"
    - test -n "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required for the GitHub mirror}"
    - test -n "${GITHUB_TOKEN:?GITHUB_TOKEN is required; create the protected tag before starting the pipeline}"

create-release:
  stage: release
  image: alpine:3.21
  interruptible: false
  needs:
    - lint
    - test
    - hassfest
    - check-version
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  before_script:
    - apk add --no-cache curl jq python3 zip
  script:
    - python3 scripts/release_notes.py CHANGELOG.md "${CI_COMMIT_TAG}" > release_notes.txt
    - ARCHIVE="teamspeak-${CI_COMMIT_TAG}.zip"
    - zip -r "$ARCHIVE" custom_components/teamspeak README.md LICENSE
    - |
      PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/teamspeak/${CI_COMMIT_TAG}/${ARCHIVE}"
      curl --fail --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "${ARCHIVE}" "${PACKAGE_URL}"
    - |
      if curl --fail --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}" > /dev/null; then
        RELEASE_METHOD="PUT"
        RELEASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}"
      else
        RELEASE_METHOD="POST"
        RELEASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
      fi
    - |
      PAYLOAD="$(jq -nc \
        --arg name "Teamspeak 3 Server ${CI_COMMIT_TAG}" \
        --arg tag "${CI_COMMIT_TAG}" \
        --arg url "${PACKAGE_URL}" \
        --arg file "/${ARCHIVE}" \
        --rawfile body release_notes.txt \
        '{name: $name, tag_name: $tag, ref: $tag, description: $body, assets: {links: [{name: "Integration archive", url: $url, filepath: $file, link_type: "package"}]}}')"
      curl --fail --location --request "$RELEASE_METHOD" \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data-binary "$PAYLOAD" \
        "$RELEASE_URL"
  artifacts:
    expire_in: 30 days
    paths:
      - release_notes.txt
      - teamspeak-${CI_COMMIT_TAG}.zip

mirror-github:
  stage: release
  image: alpine:3.21
  interruptible: false
  resource_group: github-mirror
  needs:
    - job: lint
    - job: test
    - job: hassfest
    - job: check-version
      optional: true
    - job: release-preflight
      optional: true
    - job: create-release
      artifacts: true
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache curl git jq
    - test -n "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required; see release-preflight}"
    - test -n "${GITHUB_TOKEN:?GITHUB_TOKEN is required; see release-preflight}"
    - git config --global user.name "GitLab CI"
    - git config --global user.email "ci@gitlab.p4nto.de"
    - |
      git config --global credential.helper store
      printf 'https://x-access-token:%s@github.com\n' "$GITHUB_TOKEN" > "$HOME/.git-credentials"
      chmod 600 "$HOME/.git-credentials"
    - |
      git remote remove github 2>/dev/null || true
      git remote add github "https://github.com/${GITHUB_REPOSITORY}.git"
  script:
    - |
      set -euo pipefail
      if [ -n "${CI_COMMIT_BRANCH:-}" ] && [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        git push --force github "HEAD:refs/heads/${CI_DEFAULT_BRANCH}"
      fi
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        git push --force github "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"
        BODY="$(cat release_notes.txt)"
        RELEASE_API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
        PAYLOAD="$(jq -nc \
          --arg tag "$CI_COMMIT_TAG" \
          --arg name "Teamspeak 3 Server $CI_COMMIT_TAG" \
          --arg body "$BODY" \
          '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, make_latest: "true"}')"
        if EXISTING="$(curl -fsS \
          --header "Authorization: Bearer ${GITHUB_TOKEN}" \
          --header "Accept: application/vnd.github+json" \
          "${RELEASE_API}/tags/${CI_COMMIT_TAG}" 2>/dev/null)"; then
          RELEASE_ID="$(printf '%s' "$EXISTING" | jq -r '.id')"
          curl --fail --silent --show-error --request PATCH \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "${RELEASE_API}/${RELEASE_ID}" > /dev/null
        else
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "${RELEASE_API}" > /dev/null
        fi
      fi
  after_script:
    - rm -f "$HOME/.git-credentials"
